# Three jobs, and the two macOS ones exist separately because neither can see what
# the other builds.
#
# `swift test` compiles both libraries and runs the whole suite, but it compiles
# them **for macOS** — that is the trade this package makes so the inner loop needs
# no simulator. The cost is that the eight `#if os(iOS)` blocks in SplouchUI, and
# every UIKit path they reach, are invisible to it: they can be deleted, renamed or
# broken and the suite still reports green. The `app` job is what closes that hole,
# and it is also the only thing that reads Info.plist, the asset catalogue and the
# Xcode project — none of which SwiftPM knows exist.
#
# Nothing is cached. The package has no dependencies to restore (CONTRIBUTING.md
# says why), and a warm DerivedData is worth less than the time spent proving it is
# not stale.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the tree and nothing else. Nothing here pushes, comments or
# uploads, so the token gets no more than that (zizmor checks).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: swift test · macOS
    # Free for public repositories. macOS minutes bill at 10× on a private repo —
    # worth knowing before this runs on every push there.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        # Recorded in the log on purpose: `macos-latest` moves, and when a failure
        # here does not reproduce on someone's machine this is the first line to
        # compare. The floor is asserted rather than assumed — Package.swift is
        # swift-tools-version 6.0 and the tree is strict-concurrency throughout, so
        # an older toolchain fails in ways that read like our own bugs.
        run: |
          xcodebuild -version
          swift --version
          swift --version 2>&1 | grep -qE 'Apple Swift version ([6-9]|[1-9][0-9])\.' \
            || { echo "::error::Swift 6 or newer is required"; exit 1; }

      - name: Tests
        # LiveServerTests skips here by design: its two checks need a real server at
        # SPLOUCH_LIVE_SERVER and there is none on a runner. Everything else uses the
        # HTTP stub and the fake WebSocket in Tests/SplouchCoreTests/Support/.
        #
        # -warnings-as-errors: the tree builds with none, and this keeps it there. A
        # deprecation or an unused binding is cheaper to fix in the commit that made
        # it than in a sweep later.
        #
        # `shell: bash` is what turns on pipefail. The default shell is `bash -e`
        # without it, so the step would take tee's exit code and a failing test
        # would leave it green.
        shell: bash
        run: swift test -Xswiftc -warnings-as-errors --enable-code-coverage 2>&1 | tee test.log

      - name: Check the suite really ran
        # The guard that makes green mean green. A test target that builds but
        # discovers nothing exits 0 and reports a pass, which is the one failure mode
        # a green tick cannot be trusted about. The floor is well under the current
        # count — raise it if it ever starts catching real growth instead of breakage.
        run: |
          count=$(sed -n 's/.*Test run with \([0-9]*\) tests.*/\1/p' test.log | tail -1)
          echo "discovered ${count:-0} tests"
          [ "${count:-0}" -ge 150 ] \
            || { echo "::error::only ${count:-0} tests ran; the suite is around 195"; exit 1; }

      - name: Coverage
        # Printed into this log and nothing else: not uploaded, not gated, no badge.
        #
        # Two tables, not one. SplouchCore is a library and is nearly all covered;
        # SplouchUI is ~2400 lines of SwiftUI `body` that needs a host to run, plus
        # a few hundred lines of real logic that does not. Averaging them produces a
        # number that describes neither, and it would move when a view grew rather
        # than when anything went untested. Read them apart: the core's total is a
        # figure to hold, the UI's is not.
        #
        # NetworkWatcher is the one file still at 0% on purpose: NWPathMonitor
        # reports the machine's real network path, so the only way to test it is to
        # inject a fake and watch a boolean come back, which is a test of the fake.
        # Read the tables for which *branch* of a decoder went untried, not the total.
        #
        # `Sources/…` as a positional filter rather than an ignore-regex: it drops
        # the test targets and SwiftPM's generated resource accessors in one move,
        # and llvm-cov then strips the common prefix so the paths stay readable.
        #
        # No `swift` command runs here, and that is the fix for a runner that
        # came back with `default.profdata: No such file or directory`. Both
        # `swift build --show-bin-path` and `swift test --show-codecov-path`
        # re-enter SwiftPM: the first can relink the test binary, which makes it
        # newer than the profile and makes llvm-cov exit non-zero; the second
        # re-enters coverage setup, which is free to clear the very directory it
        # is being asked about. The paths are on disk already — this reads them.
        #
        # Nothing here fails the build. Coverage gates nothing by design, so a
        # missing or stale profile is a warning and a skipped table, not a red
        # run over a number this project holds nobody to.
        run: |
          xctest=$(find .build -maxdepth 4 -name '*.xctest' | head -1)
          if [ -z "$xctest" ]; then
            echo "::warning::no test bundle under .build; skipping the tables"
            exit 0
          fi
          bin=$(dirname "$xctest")
          cov="$bin/codecov"
          echo "test bundle: $xctest"
          ls -la "$cov" 2>/dev/null || echo "(no codecov directory)"

          profdata="$cov/default.profdata"
          if [ ! -f "$profdata" ]; then
            # A glob into an array, not `find` into a bare word: SwiftPM names
            # one of these "Swift Testing<n>.profraw", and the space in it turns
            # an unquoted expansion into two paths that do not exist.
            shopt -s nullglob
            raws=("$cov"/*.profraw)
            shopt -u nullglob
            if [ ${#raws[@]} -eq 0 ]; then
              echo "::warning::no coverage profile was produced; skipping the tables"
              exit 0
            fi
            echo "no merged profile — merging ${#raws[@]} raw one(s)"
            xcrun llvm-profdata merge -sparse "${raws[@]}" -o "$profdata"
          fi

          binary="$xctest/Contents/MacOS/$(basename "$xctest" .xctest)"
          for module in SplouchCore SplouchUI; do
            echo "── $module ─────────────────────────────────────────────"
            xcrun llvm-cov report "$binary" -instr-profile "$profdata" "Sources/$module/" \
              || echo "::warning::llvm-cov could not report on $module"
          done

  app:
    name: iOS app target
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Package for iOS, warnings as errors
        # The `#if os(iOS)` blocks get no warning check anywhere else. Xcode builds
        # a local package with its warnings suppressed, and passing
        # SWIFT_TREAT_WARNINGS_AS_ERRORS to xcodebuild conflicts with that and fails
        # the build. SwiftPM cross-compiling to the simulator SDK is what reports them.
        run: |
          swift build --triple arm64-apple-ios17.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --scratch-path .build/ios -Xswiftc -warnings-as-errors

      - name: Build for the simulator
        # `generic/platform=iOS Simulator` compiles against the simulator SDK without
        # naming a device or booting one, so this does not break the day the runner
        # image stops shipping whichever iPhone was hard-coded here. Signing is off:
        # a simulator build needs none, and the project carries no team.
        run: |
          xcodebuild -project App/Splouch.xcodeproj -scheme Splouch \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ci \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check the bundle came out whole
        # Info.plist is not built by SwiftPM and not read by any test, so a key lost
        # in a merge reaches a phone unless something looks. These four are the ones
        # the contract requires (app.md P-12, T-03) and the ones whose absence is
        # silent: the app still launches, it just cannot reach a Pi, find a server or
        # draw a digit in the right face.
        run: |
          app=.build/ci/Build/Products/Debug-iphonesimulator/Splouch.app
          plist=$app/Info.plist
          test -d "$app" || { echo "::error::no app bundle at $app"; exit 1; }
          for key in NSAppTransportSecurity NSLocalNetworkUsageDescription NSBonjourServices UIAppFonts; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist" >/dev/null 2>&1 \
              || { echo "::error::Info.plist is missing $key"; exit 1; }
          done
          echo "fonts bundled: $(find "$app/Fonts" -name '*.ttf' 2>/dev/null | wc -l | tr -d ' ')"

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh

      - name: Syntax-check the scripts
        # Not shellcheck: both scripts are zsh — update-strings.sh uses glob
        # qualifiers (`*.json(N)`) that no POSIX shell parses — and shellcheck has no
        # zsh dialect. `zsh -n` is what is left, and it catches the unbalanced quote
        # or missing `fi` that would otherwise be found by a release.
        run: zsh -n scripts/*.sh

  lint:
    name: Markdown and workflows
    # The docs are where this tree keeps its reasoning, and parity.md is a table
    # that a single stray newline cuts short on GitHub. The workflow is checked
    # because it is the one file that decides what green means here.
    #
    # The tools are pinned here and nowhere else: this repo has no Python project
    # for a lockfile to live in. Dependabot bumps the actions but not these
    # versions. Move them by hand, together with the server repo's uv.lock.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Markdown
        # Rules in .markdownlint.json, which the VS Code extension reads too.
        # `uvx rumdl fmt .` fixes what it flags.
        run: uvx rumdl@0.2.77 check .

      - name: Workflows
        # Expressions, runner labels, and ShellCheck over every `run:` block (the
        # runner image ships ShellCheck).
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: Workflow security
        # Token permissions, persisted credentials, unpinned actions, template
        # injection. --offline: the audits that need the GitHub API are skipped, so
        # the result depends on this file alone.
        run: uvx zizmor@1.30.1 --offline .github/workflows/
